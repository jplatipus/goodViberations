<!DOCTYPE html>
<html>
    <head>
      <title>Entry Details</title>
        <link type="text/css" rel="stylesheet" href="css.css" />
    </head>
    <body>
        The Entry Detail page shows all the details of the selected entry.
        <ul>
            <li>To copy a field's value to the clipboard, tap it, then tap <span class="emphasize">Copy</span> in the toolbar at the bottom of the page. Blank values cannot be copied.</li>
            <li>To change one or more of the fields, tap <span class="emphasize">Edit</span> at the top of the page.</li>
        </ul>
    </body>
</html>
